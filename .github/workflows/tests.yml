name: Run Tests

# 1. When should this run?
on:
  push:
    branches:
      - new_pipeline
  pull_request:
    branches:
      - new_pipeline

# 2. What should it do?
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's code onto the GitHub server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.11 (matching your pyproject.toml)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Makes future runs much faster!

      # Step 3: Install your chatbot and the testing tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Step 4: Run pytest using the config we built
      - name: Run Pytest with Coverage
        run: pytest
