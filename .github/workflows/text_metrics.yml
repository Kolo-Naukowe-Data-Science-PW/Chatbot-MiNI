name: Generation metrics

on:
  workflow_dispatch:
    inputs:
      generated_csv:
        description: 'Path to CSV with generated answers (columns: pytanie, odpowiedz)'
        required: false
        default: 'src/evaluation/data/QA_rag.csv'

jobs:
  text-metrics:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Run text metrics (Docker)
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            python:3.11-alpine \
            sh -c 'pip install --no-cache-dir --quiet sacrebleu rouge nltk pandas && \
                   export PYTHONPATH=/app/src && \
                   python /app/src/evaluation/text_metrics.py \
                     --generated-csv "${{ inputs.generated_csv }}" \
                     --output-dir /app/src/evaluation/results && \
                   pip cache purge'

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-metrics-${{ github.run_id }}
          path: src/evaluation/results/text_metrics_*
          if-no-files-found: warn
