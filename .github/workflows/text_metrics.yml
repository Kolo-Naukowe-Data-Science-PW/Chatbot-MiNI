name: Generation metrics

on:
  workflow_dispatch:
    inputs:
      generated_answers:
        description: 'Path to generated answers CSV (pytanie, odpowiedz_wygenerowana)'
        required: true
        default: 'src/evaluation/data/stat_test/200/answers_google_gemini-3.5-flash_t0.2_p2_200.csv'
        type: choice
        options:
          - 'src/evaluation/data/stat_test/200/answers_google_gemini-3.5-flash_t0.2_p2_200.csv'
          - 'src/evaluation/data/stat_test/200/answers_openai_gpt-oss-120b_free_t0.2_p2_200.csv'
          - 'src/evaluation/data/answers_google_gemini-3.5-flash_t0.2_p2.csv'
          - 'src/evaluation/data/answers_openai_gpt-oss-120b_free_t0.2_p2-1.csv'
          - 'src/evaluation/data/answers_openai_gpt-oss-120b_free_t0.2_p2_1324.csv'
          - 'src/evaluation/data/answers_anthropic_claude-opus-4.8_t0.2_p2.csv'
          - 'src/evaluation/data/answers_google_gemma-4-31b-it_free_t0.2_p2.csv'
          - 'custom'
      custom_generated_path:
        description: 'Custom path (used only if generated_answers=custom)'
        required: false
        default: ''
      reference_csv:
        description: 'Path to reference answers'
        required: false
        default: 'src/evaluation/data/final_notebooklm_QA_stat_test.csv'
        type: choice
        options:
          - 'src/evaluation/data/final_notebooklm_QA_stat_test.csv'
          - 'src/evaluation/data/final_notebooklm_QA_reference.csv'
          - 'src/evaluation/data/final_notebooklm_QA.jsonl'

jobs:
  text-metrics:
    runs-on: self-hosted
    steps:
      - name: Free disk space
        run: |
          docker builder prune -af --filter "unused-for=24h" || true
          rm -rf /tmp/* || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Resolve generated answers path
        id: paths
        shell: bash
        run: |
          GENERATED="${{ inputs.generated_answers }}"
          if [ "$GENERATED" = "custom" ]; then
            GENERATED="${{ inputs.custom_generated_path }}"
          fi
          if [ ! -f "$GENERATED" ]; then
            echo "Generated answers file not found: $GENERATED" >&2
            exit 1
          fi
          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"

      - name: Run text metrics
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            python:3.11-slim \
            bash -c 'pip install --no-cache-dir -q "numpy<2" sacrebleu rouge nltk pandas bert-score && \
                     export PYTHONPATH=/app/src && \
                     python /app/src/evaluation/text_metrics.py \
                       --generated-csv "${{ steps.paths.outputs.generated }}" \
                       --reference-csv "${{ inputs.reference_csv }}" \
                       --output-dir /app/src/evaluation/results'

      - name: Cleanup
        if: always()
        run: |
          docker builder prune -af --filter "unused-for=24h" || true
          rm -rf /tmp/* || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-metrics-${{ github.run_id }}
          path: src/evaluation/results/text_metrics_*
          if-no-files-found: warn
