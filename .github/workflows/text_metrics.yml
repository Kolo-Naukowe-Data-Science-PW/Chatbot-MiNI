name: Generation metrics

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Chatbot /chat endpoint URL'
        required: true
        default: 'http://api:8000/chat'
      input_csv:
        description: 'Path to CSV with questions (columns: pytanie, odpowiedz)'
        required: false
        default: 'src/evaluation/data/QA_rag.csv'

jobs:
  text-metrics:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Run generation metrics
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            python:3.11-slim \
            bash -c 'pip install --no-cache-dir --quiet "numpy<2" && \
                     pip install --no-cache-dir --quiet sacrebleu rouge nltk pandas requests && \
                     export PYTHONPATH=/app/src && \
                     python /app/src/evaluation/quick_generation_metrics.py \
                       --api-url "${{ inputs.api_url }}" \
                       --input-csv "${{ inputs.input_csv }}" \
                       --output-dir /app/src/evaluation/results && \
                     pip cache purge'

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-metrics-${{ github.run_id }}
          path: src/evaluation/results/generation_metrics_*
          if-no-files-found: warn
