name: Generation metrics

on:
  workflow_dispatch:
    inputs:
      per_query_csv:
        description: 'Path to *_per_query.csv from run_experiment (columns: query, generated_answer)'
        required: true
        default: 'src/evaluation/results/baseline_rag_*_per_query.csv'
      reference_csv:
        description: 'Path to reference answers (default: QA_rag.csv)'
        required: false
        default: 'src/evaluation/data/QA_rag.csv'

jobs:
  text-metrics:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Run generation metrics from experiment
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            python:3.11-slim \
            bash -c 'pip install --no-cache-dir --quiet "numpy<2" && \
                     pip install --no-cache-dir --quiet sacrebleu rouge nltk pandas && \
                     export PYTHONPATH=/app/src && \
                     python /app/src/evaluation/metrics_from_experiment.py \
                       --per-query-csv "${{ inputs.per_query_csv }}" \
                       --reference-csv "${{ inputs.reference_csv }}" \
                       --output-dir /app/src/evaluation/results && \
                     pip cache purge'

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-metrics-${{ github.run_id }}
          path: src/evaluation/results/generation_metrics_*
          if-no-files-found: warn
          if-no-files-found: warn
