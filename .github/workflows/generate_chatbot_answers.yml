name: Generate Chatbot Answers

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Generator model"
        required: true
        default: "anthropic/claude-opus-4.8"
        type: choice
        options:
          - "anthropic/claude-opus-4.8"
          - "openai/gpt-4o"
          - "google/gemini-3.5-flash"
          - "openai/gpt-oss-120b:free"
          - "google/gemma-4-31b-it:free"
          - "openai/gpt-oss-20b:free"
          - "custom"
      custom_model:
        description: "Custom model id, used only when model=custom"
        required: false
        default: ""
      temperature:
        description: "Generation temperature"
        required: true
        default: "0.2"
      persona:
        description: "Persona index"
        required: true
        default: "2"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      limit:
        description: "Optional question limit; leave empty for all"
        required: false
        default: ""
      timeout:
        description: "Per-call /chat timeout in seconds"
        required: false
        default: "180"
      sleep:
        description: "Seconds to sleep between API calls"
        required: false
        default: "0.5"
      output_name:
        description: "Output CSV filename; for 200_stat_test the stat_test_folder suffix is added before .csv"
        required: false
        default: ""
      question_set:
        description: "Question set for generation"
        required: true
        default: "200_stat_test"
        type: choice
        options:
          - "200_stat_test"
          - "1428_full"
          - "1324_reference"
          - "custom"
      custom_input_file:
        description: "Custom input questions file, used only when question_set=custom"
        required: false
        default: ""
      output_columns:
        description: "Columns to include after the question column"
        required: true
        default: "answers_and_links"
        type: choice
        options:
          - "answers_and_links"
          - "answer_only"
          - "links_only"
      stat_test_folder:
        description: "Subfolder under src/evaluation/data/stat_test for generated files"
        required: true
        default: "200"

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/.env.backup .env

      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          MODEL="${{ inputs.model }}"
          if [ "$MODEL" = "custom" ]; then
            MODEL="${{ inputs.custom_model }}"
          fi
          if [ -z "$MODEL" ]; then
            echo "custom_model must be provided when model=custom" >&2
            exit 1
          fi

          SAFE_MODEL="$(printf '%s' "$MODEL" | tr '/:' '__' | tr -cd 'A-Za-z0-9_.-')"
          OUTPUT_NAME="${{ inputs.output_name }}"
          if [ -z "$OUTPUT_NAME" ]; then
            OUTPUT_NAME="answers_${SAFE_MODEL}_t${{ inputs.temperature }}_p${{ inputs.persona }}.csv"
          fi
          OUTPUT_NAME="$(basename "$OUTPUT_NAME")"
          STAT_TEST_FOLDER="$(basename "${{ inputs.stat_test_folder }}")"
          if [ -z "$STAT_TEST_FOLDER" ]; then
            echo "stat_test_folder must be provided" >&2
            exit 1
          fi
          OUTPUT_DIR="src/evaluation/data"
          STAT_TEST_DIR="src/evaluation/data/stat_test/$STAT_TEST_FOLDER"

          case "${{ inputs.question_set }}" in
            1428_full)
              INPUT_FILE="src/evaluation/data/final_notebooklm_QA.jsonl"
              ;;
            1324_reference)
              INPUT_FILE="src/evaluation/data/final_notebooklm_QA_reference.csv"
              ;;
            200_stat_test)
              INPUT_FILE="src/evaluation/data/final_notebooklm_QA_stat_test.csv"
              OUTPUT_DIR="$STAT_TEST_DIR"
              OUTPUT_STEM="${OUTPUT_NAME%.csv}"
              if [[ "$OUTPUT_STEM" != *"_$STAT_TEST_FOLDER" ]]; then
                OUTPUT_STEM="${OUTPUT_STEM}_$STAT_TEST_FOLDER"
              fi
              OUTPUT_NAME="${OUTPUT_STEM}.csv"
              ;;
            custom)
              INPUT_FILE="${{ inputs.custom_input_file }}"
              ;;
            *)
              echo "Unsupported question_set: ${{ inputs.question_set }}" >&2
              exit 1
              ;;
          esac

          if [ -z "$INPUT_FILE" ]; then
            echo "custom_input_file must be provided when question_set=custom" >&2
            exit 1
          fi
          if [ ! -f "$INPUT_FILE" ]; then
            echo "Input file not found: $INPUT_FILE" >&2
            exit 1
          fi

          {
            echo "model=$MODEL"
            echo "safe_model=$SAFE_MODEL"
            echo "output_name=$OUTPUT_NAME"
            echo "output_dir=$OUTPUT_DIR"
            echo "output_file=$OUTPUT_DIR/$OUTPUT_NAME"
            echo "input_file=$INPUT_FILE"
            echo "stat_test_dir=$STAT_TEST_DIR"
            echo "stat_test_name=text_metrics_per_query_${SAFE_MODEL}_t${{ inputs.temperature }}_p${{ inputs.persona }}_${STAT_TEST_FOLDER}.csv"
            echo "stat_test_file=$STAT_TEST_DIR/text_metrics_per_query_${SAFE_MODEL}_t${{ inputs.temperature }}_p${{ inputs.persona }}_${STAT_TEST_FOLDER}.csv"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure API container is running
        run: docker compose up -d api

      - name: Wait for API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if docker compose exec -T api micromamba run -n app python -c \
              "from urllib.request import urlopen; urlopen('http://localhost:8000/docs', timeout=2)" >/dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
          done
          echo "API did not become ready in time" >&2
          docker compose ps
          exit 1

      - name: Copy generator and NotebookLM questions into API container
        run: |
          docker compose exec -T api mkdir -p \
            /app/src/evaluation/llm_judge \
            /app/src/evaluation/data \
            "/app/${{ steps.vars.outputs.output_dir }}" \
            "/app/${{ steps.vars.outputs.stat_test_dir }}"

          docker compose cp \
            src/evaluation/llm_judge/generate_chatbot_answers.py \
            api:/app/src/evaluation/llm_judge/generate_chatbot_answers.py

          docker compose cp \
            "${{ steps.vars.outputs.input_file }}" \
            api:/app/src/evaluation/data/$(basename "${{ steps.vars.outputs.input_file }}")

          if [ -f "${{ steps.vars.outputs.output_file }}" ]; then
            docker compose cp \
              "${{ steps.vars.outputs.output_file }}" \
              "api:/app/${{ steps.vars.outputs.output_file }}"
          fi

          docker compose cp \
            src/evaluation/text_metrics.py \
            api:/app/src/evaluation/text_metrics.py

      - name: Generate answers
        shell: bash
        run: |
          set -euo pipefail

          LIMIT_ARG=()
          if [ -n "${{ inputs.limit }}" ]; then
            LIMIT_ARG=(--limit "${{ inputs.limit }}")
          fi

          docker compose exec -T api micromamba run -n app python \
            -m evaluation.llm_judge.generate_chatbot_answers \
            --input-csv "/app/src/evaluation/data/$(basename "${{ steps.vars.outputs.input_file }}")" \
            --output-csv "/app/${{ steps.vars.outputs.output_file }}" \
            --api-url http://localhost:8000/chat \
            --models "${{ steps.vars.outputs.model }}" \
            --temperatures "${{ inputs.temperature }}" \
            --personas "${{ inputs.persona }}" \
            --timeout "${{ inputs.timeout }}" \
            --sleep "${{ inputs.sleep }}" \
            --output-format "${{ inputs.output_columns }}" \
            "${LIMIT_ARG[@]}"

      - name: Copy CSV from API container
        run: |
          mkdir -p "${{ steps.vars.outputs.output_dir }}"
          mkdir -p feedback-output
          docker compose cp \
            "api:/app/${{ steps.vars.outputs.output_file }}" \
            "${{ steps.vars.outputs.output_file }}"
          cp \
            "${{ steps.vars.outputs.output_file }}" \
            "./feedback-output/${{ steps.vars.outputs.output_name }}"
          ls -la feedback-output
          wc -l "feedback-output/${{ steps.vars.outputs.output_name }}"

      - name: Compute per-query text metrics for statistical tests
        shell: bash
        run: |
          set -euo pipefail

          docker compose exec -T api mkdir -p \
            /app/src/evaluation/results \
            "/app/${{ steps.vars.outputs.stat_test_dir }}"

          docker compose exec -T api micromamba run -n app python \
            /app/src/evaluation/text_metrics.py \
            --generated-csv "/app/${{ steps.vars.outputs.output_file }}" \
            --reference-csv "/app/src/evaluation/data/$(basename "${{ steps.vars.outputs.input_file }}")" \
            --output-dir /app/src/evaluation/results

          LATEST_PER_QUERY="$(docker compose exec -T api sh -c \
            'ls -t /app/src/evaluation/results/text_metrics_per_query_*.csv | head -1')"
          docker compose exec -T api cp \
            "$LATEST_PER_QUERY" \
            "/app/${{ steps.vars.outputs.stat_test_file }}"

          mkdir -p "${{ steps.vars.outputs.stat_test_dir }}"
          docker compose cp \
            "api:/app/${{ steps.vars.outputs.stat_test_file }}" \
            "${{ steps.vars.outputs.stat_test_file }}"
          ls -la "${{ steps.vars.outputs.output_dir }}"

      - name: Commit generated answers and stat_test file
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- "${{ steps.vars.outputs.output_file }}" "${{ steps.vars.outputs.stat_test_file }}")" ]; then
            echo "No generated answer or stat_test changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.vars.outputs.output_file }}"
          git add "${{ steps.vars.outputs.stat_test_file }}"
          git commit -m "Update generated answers for ${{ steps.vars.outputs.safe_model }}"
          git push

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbot-answers-${{ steps.vars.outputs.safe_model }}-${{ github.run_id }}
          path: |
            feedback-output/*.csv
            ${{ steps.vars.outputs.stat_test_file }}
