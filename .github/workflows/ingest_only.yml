name: Ingest Only

# Use when PDFs or scraped_raw files are already present on the VM
# and you only need to re-run fact extraction + embedding.

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Copy .env file
        run: cp ~/.env.backup .env
      - name: Run ingest
        run: docker compose up --no-deps --build ingest
      - name: Clean up dangling images and build cache
        run: docker system prune -f
