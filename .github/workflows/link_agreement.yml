name: Link Agreement Tests

on:
  workflow_dispatch:
    inputs:
      model_a_csv:
        description: "Path to model A generated answers CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/answers_google_gemini-3.5-flash_t0.2_p2_200.csv"
      model_b_csv:
        description: "Path to model B generated answers CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/answers_openai_gpt-oss-120b_free_t0.2_p2_200.csv"
      model_a_name:
        description: "Display name for model A"
        required: false
        default: "Model A"
      model_b_name:
        description: "Display name for model B"
        required: false
        default: "Model B"
      gold_csv:
        description: "Path to gold links CSV (optional)"
        required: false
        default: "src/evaluation/data/final_notebooklm_QA_stat_test.csv"
      metrics_a_csv:
        description: "Path to model A per-query retrieval metrics CSV with a Hit column (optional, enables 'no inf' report)"
        required: false
        default: "src/evaluation/data/stat_test/200/retrieval_metrics_per_query_answers_google_gemini-3.5-flash_t0.2_p2_200.csv"
      metrics_b_csv:
        description: "Path to model B per-query retrieval metrics CSV with a Hit column (optional, enables 'no inf' report)"
        required: false
        default: "src/evaluation/data/stat_test/200/retrieval_metrics_per_query_answers_openai_gpt-oss-120b_free_t0.2_p2_200.csv"
  push:
    paths:
      - "src/evaluation/link_agreement_tests.py"
      - ".github/workflows/link_agreement.yml"

jobs:
  link-agreement:
    name: Goodman-Kruskal Gamma & Kappa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No third-party dependencies required — stdlib only.

      - name: Run link agreement script
        env:
          METRICS_A_CSV: ${{ github.event.inputs.metrics_a_csv }}
          METRICS_B_CSV: ${{ github.event.inputs.metrics_b_csv }}
        run: |
          ARGS=(
            "${{ github.event.inputs.model_a_csv || 'src/evaluation/data/stat_test/200/answers_google_gemini-3.5-flash_t0.2_p2_200.csv' }}"
            "${{ github.event.inputs.model_b_csv || 'src/evaluation/data/stat_test/200/answers_openai_gpt-oss-120b_free_t0.2_p2_200.csv' }}"
            --model-a-name "${{ github.event.inputs.model_a_name || 'Model A' }}"
            --model-b-name "${{ github.event.inputs.model_b_name || 'Model B' }}"
            --gold-csv "${{ github.event.inputs.gold_csv || 'src/evaluation/data/final_notebooklm_QA_stat_test.csv' }}"
            --output-dir src/evaluation/results/link_agreement
          )

          if [[ -n "$METRICS_A_CSV" && -n "$METRICS_B_CSV" ]]; then
            ARGS+=(--metrics-a-csv "$METRICS_A_CSV" --metrics-b-csv "$METRICS_B_CSV")
          fi

          python src/evaluation/link_agreement_tests.py "${ARGS[@]}"

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-agreement-results
          path: src/evaluation/results/link_agreement/
          retention-days: 30

      - name: Print report summary
        run: |
          echo "### Link Agreement Results" >> $GITHUB_STEP_SUMMARY
          REPORT=$(ls src/evaluation/results/link_agreement/link_agreement_report_*.md | tail -1)
          cat "$REPORT" >> $GITHUB_STEP_SUMMARY

          NO_INF_JSON=$(ls src/evaluation/results/link_agreement/link_agreement_no_inf_*.json 2>/dev/null | tail -1 || true)
          if [[ -n "$NO_INF_JSON" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Link Agreement (Hit==1 for both models, no inf)" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$NO_INF_JSON" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
