name: Coverage Analysis — Gold URLs in Qdrant

on:
  workflow_dispatch:
    inputs:
      show_missing:
        description: 'Print missing URLs to log?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      all_rows:
        description: 'Use all CSV rows (not just wymagany kontekst=0)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-coverage:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/.env.backup .env

      - name: Create results directory
        run: mkdir -p src/evaluation/results/coverage

      - name: Build benchmark image
        run: docker compose build benchmark

      - name: Run coverage analysis
        run: |
          MISSING_FLAG=""
          if [ "${{ inputs.show_missing }}" = "true" ]; then
            MISSING_FLAG="--show-missing"
          fi
          ALL_FLAG=""
          if [ "${{ inputs.all_rows }}" = "true" ]; then
            ALL_FLAG="--all-rows"
          fi
          docker compose --profile benchmark run --rm benchmark \
            micromamba run -n app \
            python -m evaluation.benchmark_checks.check_coverage \
              --api-base-url http://api:8000 \
              --output-dir /app/src/evaluation/results/coverage \
              $MISSING_FLAG \
              $ALL_FLAG

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.run_id }}
          path: src/evaluation/results/coverage/
          if-no-files-found: warn
