name: Ingest Subset (facts + chunks)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to ingest into qdrant_subset_db'
        required: true
        default: 'both'
        type: choice
        options:
          - facts
          - chunks
          - both
      drop_existing:
        description: 'Drop existing subset collection(s) before ingestion'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      scraped_dir:
        description: 'Path to scraped .txt files on runner (default: /root/scraped_raw_backup)'
        required: false
        default: '/root/scraped_raw_backup'

jobs:
  ingest:
    runs-on: self-hosted
    timeout-minutes: 2000
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp ~/.env.backup .env

      - name: Stop API to avoid Qdrant lock
        run: docker compose stop api

      - name: Prepare scraped subset (copy 37 source files)
        run: |
          EVAL_MOUNT="-v $(pwd)/src/evaluation:/app/src/evaluation"
          DATA_MOUNT="-v ${{ inputs.scraped_dir }}:/scraped_raw_host:ro"
          docker compose run --rm \
            $EVAL_MOUNT \
            $DATA_MOUNT \
            ingest micromamba run -n app python -m src.evaluation.prepare_chunking_subset \
              --scraped-dir /scraped_raw_host \
              --output-dir /app/src/data/subset_workspace \
              --sources-file src/evaluation/data/subset_sources.txt

      - name: Ingest facts into subset DB
        if: ${{ inputs.mode == 'facts' || inputs.mode == 'both' }}
        run: |
          INGEST_MOUNT="-v $(pwd)/src/ingestion:/app/src/ingestion"
          docker compose run --rm \
            $INGEST_MOUNT \
            -e FACTS_DIR=/app/src/data/subset_workspace/subset_facts \
            -e QDRANT_DIR=/app/src/data/qdrant_subset_db \
            ingest micromamba run -n app /bin/bash -c "
              mkdir -p /app/src/data/subset_workspace/subset_facts
              while IFS= read -r key; do
                for f in \"/app/src/data/facts/\${key}_facts.json\" \"/app/src/data/facts/curriculum_\${key}_facts.json\"; do
                  if [ -f \"\$f\" ]; then
                    cp \"\$f\" /app/src/data/subset_workspace/subset_facts/
                    echo \"[copy] \$(basename \$f)\"
                  fi
                done
              done < /app/src/data/subset_workspace/selected_sources.txt
              python -m ingestion.ingest_facts --force"

      - name: Ingest chunks into subset DB
        if: ${{ inputs.mode == 'chunks' || inputs.mode == 'both' }}
        run: |
          INGEST_MOUNT="-v $(pwd)/src/ingestion:/app/src/ingestion"
          DROP_FLAG=""
          if [ "${{ inputs.drop_existing }}" = "true" ]; then
            DROP_FLAG="--drop-existing"
          fi
          docker compose run --rm \
            $INGEST_MOUNT \
            -e QDRANT_CHUNKS_DIR=/app/src/data/qdrant_subset_db \
            ingest micromamba run -n app python -m src.ingestion.ingest_chunks \
              --scraped-dir /app/src/data/subset_workspace/scraped_subset \
              $DROP_FLAG

      - name: Restart API
        if: always()
        run: docker compose start api
