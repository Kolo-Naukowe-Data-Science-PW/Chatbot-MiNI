name: Ingest Subset (facts + chunks)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to ingest into qdrant_subset_db'
        required: true
        default: 'both'
        type: choice
        options:
          - facts
          - chunks
          - both

jobs:
  ingest:
    runs-on: self-hosted
    timeout-minutes: 2000
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp ~/.env.backup .env

      - name: Stop API to avoid Qdrant lock
        run: docker compose stop api

      - name: Scrape subset URLs into scraped_raw_subset
        run: |
          EVAL_MOUNT="-v $(pwd)/src/evaluation:/app/src/evaluation"
          INGEST_MOUNT="-v $(pwd)/src/ingestion:/app/src/ingestion"
          docker compose run --rm \
            $EVAL_MOUNT \
            $INGEST_MOUNT \
            ingest micromamba run -n app python -m src.ingestion.scrape_subset \
              --urls-file src/evaluation/data/subset_urls.txt \
              --output-dir /app/src/data/scraped_raw_subset

      - name: Extract facts from subset (LLM)
        if: ${{ inputs.mode == 'facts' || inputs.mode == 'both' }}
        run: |
          INGEST_MOUNT="-v $(pwd)/src/ingestion:/app/src/ingestion"
          docker compose run --rm \
            $INGEST_MOUNT \
            -e SCRAPED_RAW_DIR=/app/src/data/scraped_raw_subset \
            -e FACTS_DIR=/app/src/data/facts_subset \
            ingest micromamba run -n app /bin/bash -c "
              python -m src.ingestion.extract_facts --force
              python -m src.ingestion.extract_curriculum_facts --force"

      - name: Ingest facts into subset DB
        if: ${{ inputs.mode == 'facts' || inputs.mode == 'both' }}
        run: |
          INGEST_MOUNT="-v $(pwd)/src/ingestion:/app/src/ingestion"
          docker compose run --rm \
            $INGEST_MOUNT \
            -e FACTS_DIR=/app/src/data/facts_subset \
            -e QDRANT_DIR=/app/src/data/qdrant_subset_db \
            ingest micromamba run -n app python -m ingestion.ingest_facts --force

      - name: Ingest chunks into subset DB
        if: ${{ inputs.mode == 'chunks' || inputs.mode == 'both' }}
        run: |
          INGEST_MOUNT="-v $(pwd)/src/ingestion:/app/src/ingestion"
          docker compose run --rm \
            $INGEST_MOUNT \
            -e QDRANT_CHUNKS_DIR=/app/src/data/qdrant_subset_db \
            ingest micromamba run -n app python -m src.ingestion.ingest_chunks \
              --scraped-dir /app/src/data/scraped_raw_subset \
              --drop-existing

      - name: Prepare test set subsets (generated + human)
        run: |
          EVAL_MOUNT="-v $(pwd)/src/evaluation:/app/src/evaluation"
          docker compose run --rm \
            $EVAL_MOUNT \
            ingest micromamba run -n app /bin/bash -c "
              python /app/src/utils/build_file_url_mapping.py /app/src/data/scraped_raw_subset \
                > /app/src/evaluation/data/file_url_mapping.json
              python -m src.evaluation.prepare_chunking_subset \
                --scraped-dir /app/src/data/scraped_raw_subset \
                --output-dir /app/src/data/subset_workspace \
                --sources-file src/evaluation/data/subset_sources.txt"

      - name: Restart API
        if: always()
        run: docker compose start api
