name: Retrieval Metrics

on:
  workflow_dispatch:
    inputs:
      answers_csv:
        description: 'Generated answers CSV'
        required: true
        default: 'src/evaluation/data/stat_test/200/answers_google_gemini-3.5-flash_t0.2_p2_200.csv'
        type: choice
        options:
          - 'src/evaluation/data/stat_test/200/answers_google_gemini-3.5-flash_t0.2_p2_200.csv'
          - 'src/evaluation/data/stat_test/200/answers_openai_gpt-oss-120b_free_t0.2_p2_200.csv'
          - 'src/evaluation/data/answers_anthropic_claude-opus-4.8_t0.2_p2.csv'
          - 'src/evaluation/data/answers_google_gemini-3.5-flash_t0.2_p2.csv'
          - 'src/evaluation/data/answers_google_gemma-4-31b-it_free_t0.2_p2.csv'
          - 'src/evaluation/data/answers_openai_gpt-4o_t0.2_p2.csv'
          - 'src/evaluation/data/answers_openai_gpt-oss-120b_free_t0.2_p2.csv'
          - 'src/evaluation/data/answers_openai_gpt-oss-120b_free_t0.2_p2_1324.csv'
          - 'custom'
      custom_answers_csv:
        description: 'Custom generated answers CSV path, used only when answers_csv=custom'
        required: false
        default: ''
      reference_csv:
        description: 'Reference CSV/JSONL'
        required: true
        default: 'src/evaluation/data/final_notebooklm_QA_stat_test.csv'
        type: choice
        options:
          - 'src/evaluation/data/final_notebooklm_QA_stat_test.csv'
          - 'src/evaluation/data/final_notebooklm_QA_reference.csv'
          - 'src/evaluation/data/final_notebooklm_QA.jsonl'
          - 'custom'
      custom_reference_path:
        description: 'Custom reference CSV/JSONL path, used only when reference_csv=custom'
        required: false
        default: ''
      metric_mode:
        description: 'Metric calculation mode'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - 'standard'
          - 'adaptive'
          - 'both'
      ks:
        description: 'Rank cut-offs (comma-separated, e.g. 3,5,7,10) — ignored for adaptive-only mode'
        required: false
        default: '3,5,7,10'

jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/.env.backup .env

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          ANSWERS_CSV="${{ inputs.answers_csv }}"
          if [ "$ANSWERS_CSV" = "custom" ]; then
            ANSWERS_CSV="${{ inputs.custom_answers_csv }}"
          fi
          if [ -z "$ANSWERS_CSV" ]; then
            echo "custom_answers_csv must be provided when answers_csv=custom" >&2
            exit 1
          fi
          if [ ! -f "$ANSWERS_CSV" ]; then
            echo "Answers CSV not found: $ANSWERS_CSV" >&2
            exit 1
          fi

          REFERENCE_PATH="${{ inputs.reference_csv }}"
          if [ "$REFERENCE_PATH" = "custom" ]; then
            REFERENCE_PATH="${{ inputs.custom_reference_path }}"
          fi
          if [ -z "$REFERENCE_PATH" ]; then
            echo "custom_reference_path must be provided when reference_csv=custom" >&2
            exit 1
          fi
          if [ ! -f "$REFERENCE_PATH" ]; then
            echo "Reference file not found: $REFERENCE_PATH" >&2
            exit 1
          fi

          {
            echo "answers_csv=$ANSWERS_CSV"
            echo "reference_path=$REFERENCE_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Run benchmark
        shell: bash
        run: |
          PYTHONPATH=src python -m evaluation.retrieval_metrics_from_answers \
            --answers-csv "${{ steps.vars.outputs.answers_csv }}" \
            --reference-csv "${{ steps.vars.outputs.reference_path }}" \
            --output-dir src/evaluation/results/retrieval_metrics \
            --ks "${{ inputs.ks }}" \
            --metric-mode "${{ inputs.metric_mode }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: src/evaluation/results/
          if-no-files-found: warn
