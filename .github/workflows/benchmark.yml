name: Retrieval Metrics

on:
  workflow_dispatch:
    inputs:
      answers_csv:
        description: 'Path to answers CSV from generate_chatbot_answers (optional; if provided, uses those sources instead of calling API)'
        required: false
        default: ''
      metric_mode:
        description: 'Metric calculation mode'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - 'standard'
          - 'adaptive'
          - 'both'
      ks:
        description: 'Rank cut-offs (comma-separated, e.g. 3,5,7,10) — ignored for adaptive-only mode'
        required: false
        default: '3,5,7,10'
      timeout:
        description: 'HTTP timeout per query in seconds'
        required: false
        default: '60'

jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/.env.backup .env

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Run benchmark
        run: |
          BENCHMARK_CMD="python -m evaluation.benchmark \
            --output-dir /app/src/evaluation/results \
            --ks \"${{ inputs.ks }}\" \
            --metric-mode \"${{ inputs.metric_mode }}\" \
            --timeout \"${{ inputs.timeout }}\" \
            --no-plots"
          
          if [ -n "${{ inputs.answers_csv }}" ]; then
            BENCHMARK_CMD="$BENCHMARK_CMD --answers-csv \"${{ inputs.answers_csv }}\""
          else
            BENCHMARK_CMD="$BENCHMARK_CMD --api-url http://api:8000/chat"
          fi
          
          docker compose --profile benchmark run --rm --build=never benchmark \
            micromamba run -n app $BENCHMARK_CMD

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: src/evaluation/results/
          if-no-files-found: warn
