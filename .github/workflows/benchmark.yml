name: Retrieval Metrics

on:
  workflow_dispatch:
    inputs:
      metric_mode:
        description: 'Metric calculation mode'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - 'standard'
          - 'adaptive'
          - 'both'
      ks:
        description: 'Rank cut-offs (comma-separated, e.g. 3,5,7,10) — ignored for adaptive-only mode'
        required: false
        default: '3,5,7,10'
      timeout:
        description: 'HTTP timeout per query in seconds'
        required: false
        default: '60'

jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/.env.backup .env

      - name: Create results directory
        run: mkdir -p src/evaluation/results

      - name: Run benchmark
        run: |
          docker compose --profile benchmark run --rm --build=never benchmark \
            micromamba run -n app \
            python -m evaluation.benchmark \
              --api-url http://api:8000/chat \
              --output-dir /app/src/evaluation/results \
              --ks "${{ inputs.ks }}" \
              --metric-mode "${{ inputs.metric_mode }}" \
              --timeout "${{ inputs.timeout }}" \
              --no-plots

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: src/evaluation/results/
          if-no-files-found: warn
