name: Statistical Tests — Text and Retrieval

on:
  workflow_dispatch:
    inputs:
      model_a_name:
        description: "Model A identifier for report"
        required: true
        default: "google_gemini-3.5-flash"
        type: string
      model_a_text_csv:
        description: "Model A per-query text metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/text_metrics_per_query_google_gemini-3.5-flash_t0.2_p2_200.csv"
        type: string
      model_a_retrieval_csv:
        description: "Model A per-query retrieval metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/retrieval_metrics_per_query_answers_google_gemini-3.5-flash_t0.2_p2_200.csv"
        type: string
      model_b_name:
        description: "Model B identifier for report"
        required: true
        default: "openai_gpt-oss-120b_free"
        type: string
      model_b_text_csv:
        description: "Model B per-query text metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/text_metrics_per_query_openai_gpt-oss-120b_free_t0.2_p2_200.csv"
        type: string
      model_b_retrieval_csv:
        description: "Model B per-query retrieval metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/retrieval_metrics_per_query_answers_openai_gpt-oss-120b_free_t0.2_p2_200.csv"
        type: string
      test:
        description: "Statistical test(s) to perform"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "wilcoxon"
          - "permutation"
          - "gamma"
          - "ttest"
      alpha:
        description: "Significance level"
        required: true
        default: "0.05"
        type: string
      alternative:
        description: "Alternative hypothesis direction"
        required: true
        default: "two-sided"
        type: choice
        options:
          - "two-sided"
          - "greater"
          - "less"
      n_permutations:
        description: "Number of permutations (permutation test only)"
        required: false
        default: "10000"
        type: string

jobs:
  statistical_comparison:
    name: Compare Model A vs Model B
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate input files
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            "${{ inputs.model_a_text_csv }}" \
            "${{ inputs.model_a_retrieval_csv }}" \
            "${{ inputs.model_b_text_csv }}" \
            "${{ inputs.model_b_retrieval_csv }}"
          do
            if [ ! -f "$path" ]; then
              echo "ERROR: CSV not found: $path" >&2
              exit 1
            fi
            echo "Found CSV: $path"
          done

      - name: Run statistical comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/evaluation/results/stats

          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            python:3.11-slim \
            bash -c '
              pip install --no-cache-dir -q numpy scipy && \
              python /app/src/evaluation/statistical_comparison.py \
                --model_a_text_csv "/app/${{ inputs.model_a_text_csv }}" \
                --model_a_retrieval_csv "/app/${{ inputs.model_a_retrieval_csv }}" \
                --model_b_text_csv "/app/${{ inputs.model_b_text_csv }}" \
                --model_b_retrieval_csv "/app/${{ inputs.model_b_retrieval_csv }}" \
                --metric all \
                --test "${{ inputs.test }}" \
                --alpha "${{ inputs.alpha }}" \
                --alternative "${{ inputs.alternative }}" \
                --n_permutations "${{ inputs.n_permutations }}" \
                --output_dir /app/src/evaluation/results/stats
            ' 2>&1 | tee src/evaluation/results/stats/stats_output.log

      - name: Generate comparison report
        if: always()
        shell: bash
        run: |
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Find the JSON results file produced by the script
          JSON_FILE="$(ls src/evaluation/results/stats/stats_*.json 2>/dev/null | tail -1 || echo 'not found')"

          cat > src/evaluation/results/stats/COMPARISON_REPORT.md << EOF
          # Statistical Comparison Report

          ## Models
          | | Name | CSV |
          |---|---|---|
          | **A text** | ${{ inputs.model_a_name }} | \`${{ inputs.model_a_text_csv }}\` |
          | **A retrieval** | ${{ inputs.model_a_name }} | \`${{ inputs.model_a_retrieval_csv }}\` |
          | **B text** | ${{ inputs.model_b_name }} | \`${{ inputs.model_b_text_csv }}\` |
          | **B retrieval** | ${{ inputs.model_b_name }} | \`${{ inputs.model_b_retrieval_csv }}\` |

          ## Configuration
          | Parameter | Value |
          |---|---|
          | Metrics | all common supported text and retrieval metrics |
          | Test(s) | ${{ inputs.test }} |
          | Significance level α | ${{ inputs.alpha }} |
          | Alternative hypothesis | ${{ inputs.alternative }} |
          | Permutations | ${{ inputs.n_permutations }} |

          ## Artifacts in this download
          | File | Description |
          |---|---|
          | \`stats_output.log\` | Full console output |
          | \`stats_*.json\` | Machine-readable results (all metrics) |
          | \`COMPARISON_REPORT.md\` | This file |

          Generated: ${GENERATED_AT}
          Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

      - name: Print summary to job log
        if: always()
        shell: bash
        run: |
          if [ -f src/evaluation/results/stats/stats_output.log ]; then
            echo "=== Statistical Tests Output (last 150 lines) ==="
            tail -150 src/evaluation/results/stats/stats_output.log
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-${{ inputs.model_a_name }}-vs-${{ inputs.model_b_name }}-${{ github.run_number }}
          path: src/evaluation/results/stats/
          retention-days: 30
