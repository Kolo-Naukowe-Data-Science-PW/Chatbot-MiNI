name: Statistical Tests — Compare Two Per-Query Files

on:
  workflow_dispatch:
    inputs:
      model_a_name:
        description: "Model A identifier for report"
        required: true
        default: "google_gemini-3.5-flash"
        type: string
      model_a_csv:
        description: "Model A per-query text metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/text_metrics_per_query_google_gemini-3.5-flash_t0.2_p2_1324.csv"
        type: string
      model_b_name:
        description: "Model B identifier for report"
        required: true
        default: "openai_gpt-oss-120b_free"
        type: string
      model_b_csv:
        description: "Model B per-query text metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/text_metrics_per_query_openai_gpt-oss-120b_free_t0.2_p2_1324.csv"
        type: string
      metric:
        description: "Metric column to compare"
        required: true
        default: "bertscore_f1_base"
        type: choice
        options:
          - "bertscore_f1_base"
          - "meteor"
          - "rouge_l_f"
          - "rouge_1_f"
          - "rouge_2_f"
          - "bleu"
      test_type:
        description: "Statistical test to perform"
        required: true
        default: "wilcoxon"
        type: choice
        options:
          - "wilcoxon"
          - "gamma"
          - "kappa"
      alpha:
        description: "Significance level"
        required: true
        default: "0.05"
        type: string

jobs:
  statistical_comparison:
    name: Compare Model A vs Model B
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate input files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${{ inputs.model_a_csv }}" ]; then
            echo "Model A CSV not found: ${{ inputs.model_a_csv }}" >&2
            exit 1
          fi

          if [ ! -f "${{ inputs.model_b_csv }}" ]; then
            echo "Model B CSV not found: ${{ inputs.model_b_csv }}" >&2
            exit 1
          fi

          echo "Model A CSV: ${{ inputs.model_a_csv }}"
          echo "Model B CSV: ${{ inputs.model_b_csv }}"

      - name: Run statistical comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/evaluation/results/stats

          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            python:3.11-slim \
            bash -c 'pip install --no-cache-dir -q numpy scipy && \
                     export PYTHONPATH=/app/src && \
                     python -m evaluation.statistical_comparison \
                       --model_a_csv "/app/${{ inputs.model_a_csv }}" \
                       --model_b_csv "/app/${{ inputs.model_b_csv }}" \
                       --metric "${{ inputs.metric }}" \
                       --test-type "${{ inputs.test_type }}" \
                       --alpha "${{ inputs.alpha }}" \
                       --output_dir /app/src/evaluation/results/stats' \
            2>&1 | tee stats_output.log

      - name: Generate comparison report
        shell: bash
        run: |
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > src/evaluation/results/stats/COMPARISON_REPORT.md << EOF
          # Statistical Comparison Report

          ## Model A
          - Name: ${{ inputs.model_a_name }}
          - CSV: ${{ inputs.model_a_csv }}

          ## Model B
          - Name: ${{ inputs.model_b_name }}
          - CSV: ${{ inputs.model_b_csv }}

          ## Configuration
          - Metric: ${{ inputs.metric }}
          - Test type: ${{ inputs.test_type }}
          - Significance level: ${{ inputs.alpha }}

          See stats_output.log and JSON files in this artifact for detailed results.

          Generated: ${GENERATED_AT}
          Workflow run: [${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistical-tests-results-${{ github.run_number }}
          path: |
            src/evaluation/results/stats/
            stats_output.log
          retention-days: 30

      - name: Print statistical tests results
        if: always()
        run: |
          if [ -f stats_output.log ]; then
            echo "=== Statistical Tests Output ==="
            tail -100 stats_output.log
          fi
