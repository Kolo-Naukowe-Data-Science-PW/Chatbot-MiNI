name: Run Experiment

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Pipeline variant'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - v1_vector_only
          - v2_no_rerank
          - v3_two_step_rerank
          - v4_chunks
          - v5_no_rewrite
          - v6_two_stage_facts
          - v7_two_stage_chunks
          - all
      testset:
        description: 'Test set'
        required: true
        default: 'human'
        type: choice
        options:
          - human
          - rag
          - generated
          - both
          - all
      subset:
        description: 'Use subset DB + subset test sets (37 sources, 75% coverage each)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      judge_model:
        description: 'LLM judge model'
        required: false
        default: 'openai/gpt-4o-mini'
      n_questions:
        description: 'Number of questions (0=all)'
        required: false
        default: '0'

jobs:
  experiment:
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp ~/.env.backup .env

      - name: Stop API to avoid Qdrant lock
        run: docker compose stop api

      - name: Run experiment
        run: |
          EVAL_MOUNT="-v $(pwd)/src/evaluation:/app/src/evaluation"

          # Subset mode: override Qdrant dirs + pass --subset-dir
          SUBSET_ENV=""
          SUBSET_FLAG=""
          if [ "${{ inputs.subset }}" = "true" ]; then
            SUBSET_ENV="-e QDRANT_DIR=/app/src/data/qdrant_subset_db -e QDRANT_CHUNKS_DIR=/app/src/data/qdrant_subset_db"
            SUBSET_FLAG="--subset-dir /app/src/data/subset_workspace"
          fi

          if [ "${{ inputs.testset }}" = "both" ]; then
            TESTSETS="human rag"
          elif [ "${{ inputs.testset }}" = "all" ]; then
            TESTSETS="human rag generated"
          else
            TESTSETS=""
          fi
          if [ -n "$TESTSETS" ]; then
            for ts in $TESTSETS; do
              docker compose run --rm \
                $EVAL_MOUNT \
                $SUBSET_ENV \
                -e VARIANT=${{ inputs.variant }} \
                -e TESTSET=${ts} \
                -e JUDGE_MODEL=${{ inputs.judge_model }} \
                -e N_QUESTIONS=${{ inputs.n_questions }} \
                api micromamba run -n app python -m evaluation.run_experiment \
                  --variant ${{ inputs.variant }} \
                  --testset ${ts} \
                  --judge-model "${{ inputs.judge_model }}" \
                  --n-questions ${{ inputs.n_questions }} \
                  --output-dir src/data/experiments \
                  $SUBSET_FLAG
            done
          else
            docker compose run --rm \
              $EVAL_MOUNT \
              $SUBSET_ENV \
              -e VARIANT=${{ inputs.variant }} \
              -e TESTSET=${{ inputs.testset }} \
              -e JUDGE_MODEL=${{ inputs.judge_model }} \
              -e N_QUESTIONS=${{ inputs.n_questions }} \
              api micromamba run -n app python -m evaluation.run_experiment \
                --variant ${{ inputs.variant }} \
                --testset ${{ inputs.testset }} \
                --judge-model "${{ inputs.judge_model }}" \
                --n-questions ${{ inputs.n_questions }} \
                --output-dir src/data/experiments \
                $SUBSET_FLAG
          fi

      - name: Restart API
        if: always()
        run: docker compose start api
