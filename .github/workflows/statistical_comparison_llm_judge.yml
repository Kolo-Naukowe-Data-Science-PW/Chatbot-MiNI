name: Statistical Comparison - LLM Judge Metrics

on:
  workflow_dispatch:
    inputs:
      model_a_llm_judge_csv:
        description: "Path to Model A LLM Judge metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/llm_judge_metrics_gemini.csv"
      model_b_llm_judge_csv:
        description: "Path to Model B LLM Judge metrics CSV"
        required: true
        default: "src/evaluation/data/stat_test/200/llm_judge_metrics_gpt.csv"
      metrics:
        description: "Metrics to compare (space-separated: usefulness accuracy conciseness all)"
        required: true
        default: "all"
      tests:
        description: "Statistical tests to run (space-separated: wilcoxon permutation gamma ttest all)"
        required: true
        default: "all"
      alpha:
        description: "Significance level (default: 0.05)"
        required: false
        default: "0.05"
      alternative:
        description: "Hypothesis test type (two-sided, greater, less)"
        required: false
        default: "two-sided"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy
          pip install -e .

      - name: Verify input files exist
        run: |
          if [ ! -f "${{ github.event.inputs.model_a_llm_judge_csv }}" ]; then
            echo "ERROR: Model A CSV not found: ${{ github.event.inputs.model_a_llm_judge_csv }}"
            exit 1
          fi
          if [ ! -f "${{ github.event.inputs.model_b_llm_judge_csv }}" ]; then
            echo "ERROR: Model B CSV not found: ${{ github.event.inputs.model_b_llm_judge_csv }}"
            exit 1
          fi
          echo "✓ Both input files verified"

      - name: Run statistical comparison
        run: |
          python -m src.evaluation.statistical_comparison \
            --model_a_llm_judge_csv "${{ github.event.inputs.model_a_llm_judge_csv }}" \
            --model_b_llm_judge_csv "${{ github.event.inputs.model_b_llm_judge_csv }}" \
            --metric ${{ github.event.inputs.metrics }} \
            --test ${{ github.event.inputs.tests }} \
            --alpha "${{ github.event.inputs.alpha }}" \
            --alternative "${{ github.event.inputs.alternative }}" \
            --output_dir ./stats_output

      - name: List output files
        run: ls -lh ./stats_output/

      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-judge-stats-results
          path: ./stats_output/
          retention-days: 30

      - name: Generate summary
        run: |
          echo "## Statistical Comparison - LLM Judge Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Statistical comparison completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parameters" >> $GITHUB_STEP_SUMMARY
          echo "- **Model A CSV**: \`${{ github.event.inputs.model_a_llm_judge_csv }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Model B CSV**: \`${{ github.event.inputs.model_b_llm_judge_csv }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Metrics**: ${{ github.event.inputs.metrics }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ github.event.inputs.tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Alpha**: ${{ github.event.inputs.alpha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Alternative**: ${{ github.event.inputs.alternative }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Metrics Compared" >> $GITHUB_STEP_SUMMARY
          echo "- **usefulness** - How useful is the answer (1-5 scale)" >> $GITHUB_STEP_SUMMARY
          echo "- **accuracy** - How accurate is the answer (1-5 scale)" >> $GITHUB_STEP_SUMMARY
          echo "- **conciseness** - How concise is the answer (1-5 scale)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statistical Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **wilcoxon** - Wilcoxon Signed-Rank Test (non-parametric)" >> $GITHUB_STEP_SUMMARY
          echo "- **permutation** - Paired Permutation Test" >> $GITHUB_STEP_SUMMARY
          echo "- **gamma** - Goodman-Kruskal γ (ordinal association)" >> $GITHUB_STEP_SUMMARY
          echo "- **ttest** - Paired T-Test (parametric)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts for detailed results (JSON with all statistics and test results)" >> $GITHUB_STEP_SUMMARY
