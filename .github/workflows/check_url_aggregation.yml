name: Ablation — URL-level Score Aggregation

on:
  workflow_dispatch:
    inputs:
      ks:
        description: 'Rank cut-offs (comma-separated)'
        required: false
        default: '3,5,10'
      check_coverage:
        description: 'Compute coverage-corrected hit@k (cch@k)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-url-aggregation:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env file
        run: cp ~/.env.backup .env

      - name: Create results directory
        run: mkdir -p src/evaluation/results/url_aggregation_check

      - name: Build benchmark image
        run: docker compose build benchmark

      - name: Run URL aggregation ablation
        run: |
          COVERAGE_FLAG=""
          if [ "${{ inputs.check_coverage }}" = "true" ]; then
            COVERAGE_FLAG="--check-coverage"
          fi
          docker compose --profile benchmark run --rm benchmark \
            micromamba run -n app \
            python -m evaluation.benchmark_checks.check_url_aggregation \
              --api-base-url http://api:8000 \
              --ks "${{ inputs.ks }}" \
              --output-dir /app/src/evaluation/results/url_aggregation_check \
              $COVERAGE_FLAG

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: url-aggregation-check-${{ github.run_id }}
          path: src/evaluation/results/url_aggregation_check/
          if-no-files-found: warn
