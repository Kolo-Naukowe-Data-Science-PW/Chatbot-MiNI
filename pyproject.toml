[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-mini"
version = "0.1.0"
description = "MiNI PW Chatbot with RAG"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",
]

[tool.setuptools.packages.find]
where = ["src"]
# NEW: Don't include tests when building the production package
exclude = ["*.tests", "*.tests.*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]

[tool.pytest.ini_options]
minversion = "7.0"
# --- CHANGED: Added --import-mode=importlib ---
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=80 --import-mode=importlib"
testpaths = [
    "src",
]
asyncio_mode = "auto"
pythonpath = ["src"]

# NEW: Tell coverage to ignore the test files themselves
[tool.coverage.run]
omit = ["*/tests/*"]
