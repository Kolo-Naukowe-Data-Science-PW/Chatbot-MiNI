version: "3.9"

volumes:
  final_storage:
  qdrant_db:
  qdrant_chunks_db:
  qdrant_subset_db:
  hf_cache:
  data_storage:

x-env: &env
  PYTHONUNBUFFERED: "1"
  HF_HOME: /root/.cache/huggingface
  PYTHONPATH: /app/src
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
  PIPELINE_VERSION: ${PIPELINE_VERSION:-3}
  QDRANT_DIR: /app/src/data/qdrant_db
  QDRANT_CHUNKS_DIR: /app/src/data/qdrant_chunks_db
  QDRANT_SUBSET_DIR: /app/src/data/qdrant_subset_db
  # Abuse protection (see src/api/security.py and the README)
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
  ENABLE_DOCS: ${ENABLE_DOCS:-0}
  QUERY_MAX_CHARS: ${QUERY_MAX_CHARS:-1000}
  MAX_TOKENS_CAP: ${MAX_TOKENS_CAP:-2048}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-20}
  RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-150}
  BUDGET_PER_IP_USD_HOUR: ${BUDGET_PER_IP_USD_HOUR:-0.50}
  BUDGET_GLOBAL_USD_HOUR: ${BUDGET_GLOBAL_USD_HOUR:-10}
  BUDGET_WARN_RATIO: ${BUDGET_WARN_RATIO:-0.8}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
  RETRIEVAL_TOP_K_MAX: ${RETRIEVAL_TOP_K_MAX:-50}
  COST_INPUT_USD_PER_MTOK: ${COST_INPUT_USD_PER_MTOK:-0.29}
  COST_OUTPUT_USD_PER_MTOK: ${COST_OUTPUT_USD_PER_MTOK:-1.14}
  COST_OVERHEAD_USD_PER_REQUEST: ${COST_OVERHEAD_USD_PER_REQUEST:-0.0005}
  SECURITY_LOG_THROTTLE_SEC: ${SECURITY_LOG_THROTTLE_SEC:-60}
  MODEL_ALLOWLIST: ${MODEL_ALLOWLIST:-}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek/deepseek-chat-v3-0324}

services:

  scraper:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "python",
      "-m",
      "ingestion.scraper"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - final_storage:/app/src/data/final_storage
      - hf_cache:/root/.cache/huggingface

  ingest:
    user: root
    build: .
    command: >
      micromamba run -n app /bin/bash -c "
      python -m ingestion.ingest_manual_pdfs &&
      python -m ingestion.ingest_manual_xlsx &&
      python -m ingestion.describe_files &&
      python -m ingestion.extract_facts &&
      python -m ingestion.extract_curriculum_facts &&
      python -m ingestion.ingest_facts"
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - qdrant_chunks_db:/app/src/data/qdrant_chunks_db
      - qdrant_subset_db:/app/src/data/qdrant_subset_db
      - hf_cache:/root/.cache/huggingface
    #depends_on:
    #  scraper:
    #    condition: service_completed_successfully

  schedule:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "python",
      "-m",
      "ingestion.ingest_schedule"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - hf_cache:/root/.cache/huggingface

  curriculum:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "python",
      "-m",
      "ingestion.ingest_curriculum"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - hf_cache:/root/.cache/huggingface

  api:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "uvicorn",
      "api.api:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8000"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - qdrant_chunks_db:/app/src/data/qdrant_chunks_db
      - qdrant_subset_db:/app/src/data/qdrant_subset_db
    expose:
      - "8000"
    restart: always

  frontend:
    build:
      context: ./src/frontend
    environment:
      VITE_API_URL: "http://api:8000/chat"
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: always

  benchmark:
    user: root
    build: .
    command: >
      micromamba run -n app
      python -m evaluation.benchmark
      --api-url http://api:8000/chat
      --output-dir /app/src/evaluation/results
      --no-plots
    environment: *env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./src/evaluation/results:/app/src/evaluation/results
    profiles: ["benchmark"]

  api_test_health: #test
    image: curlimages/curl:8.12.1 #test
    command: ["-sS", "-i", "http://api:8000/health"] #test
    depends_on:
      - api
    profiles: ["test"] #test

  api_test_chat: #test
    image: curlimages/curl:8.12.1 #test
    command: ["-sS", "-i", "-X", "POST", "http://api:8000/chat", "-H", "Content-Type: application/json", "-d", "{\"query\":\"test\",\"language\":\"pl\"}"] #test
    depends_on:
      - api
    profiles: ["test_chat"] #test
