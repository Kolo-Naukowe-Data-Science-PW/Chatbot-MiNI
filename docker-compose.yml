version: "3.9"

volumes:
  final_storage:
  qdrant_db:
  qdrant_chunks_db:
  hf_cache:
  data_storage:

x-env: &env
  PYTHONUNBUFFERED: "1"
  HF_HOME: /root/.cache/huggingface
  PYTHONPATH: /app/src
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
  PIPELINE_VERSION: ${PIPELINE_VERSION:-3}
  QDRANT_DIR: /app/src/data/qdrant_db
  QDRANT_CHUNKS_DIR: /app/src/data/qdrant_chunks_db

services:

  scraper:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "python",
      "-m",
      "ingestion.scraper"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - final_storage:/app/src/data/final_storage
      - hf_cache:/root/.cache/huggingface

  ingest:
    user: root
    build: .
    command: >
      micromamba run -n app /bin/bash -c "
      python -m ingestion.ingest_manual_pdfs &&
      python -m ingestion.ingest_manual_xlsx &&
      python -m ingestion.describe_files &&
      python -m ingestion.extract_facts &&
      python -m ingestion.extract_curriculum_facts &&
      python -m ingestion.ingest_facts"
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - qdrant_chunks_db:/app/src/data/qdrant_chunks_db
      - hf_cache:/root/.cache/huggingface
    #depends_on:
    #  scraper:
    #    condition: service_completed_successfully

  schedule:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "python",
      "-m",
      "ingestion.ingest_schedule"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - hf_cache:/root/.cache/huggingface

  curriculum:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "python",
      "-m",
      "ingestion.ingest_curriculum"
    ]
    environment: *env
    volumes:
      - data_storage:/app/src/data
      - qdrant_db:/app/src/data/qdrant_db
      - hf_cache:/root/.cache/huggingface

  api:
    user: root
    build: .
    command: [
      "micromamba",
      "run",
      "-n",
      "app",
      "uvicorn",
      "api.api:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8000"
    ]
    environment: *env
    volumes:
      - qdrant_db:/app/src/data/qdrant_db
      - qdrant_chunks_db:/app/src/data/qdrant_chunks_db
    expose:
      - "8000"
    restart: always

  frontend:
    build:
      context: ./src/frontend
    environment:
      VITE_API_URL: "http://api:8000/chat"
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: always

  benchmark:
    user: root
    build: .
    command: >
      micromamba run -n app
      python -m evaluation.benchmark
      --api-url http://api:8000/chat
      --output-dir /app/src/evaluation/results
      --no-plots
    environment: *env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./src/evaluation/results:/app/src/evaluation/results
    profiles: ["benchmark"]

  api_test_health: #test
    image: curlimages/curl:8.12.1 #test
    command: ["-sS", "-i", "http://api:8000/docs"] #test
    depends_on:
      - api
    profiles: ["test"] #test

  api_test_chat: #test
    image: curlimages/curl:8.12.1 #test
    command: ["-sS", "-i", "-X", "POST", "http://api:8000/chat", "-H", "Content-Type: application/json", "-d", "{\"query\":\"test\",\"language\":\"pl\"}"] #test
    depends_on:
      - api
    profiles: ["test_chat"] #test
